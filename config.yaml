# Video Processing Configuration
video:
  input_path: "watchtower.mp4" #"/root/code/datasets/tanks_and_temples/videos/Courtroom/Courtroom.mp4" "swapnanil.mp4"
  fps: 2 # extract every n-th frame in the video or in other words divide video frame rate by this value
  extracted_image_dir: "/root/code/output/extracted_frames"
  video_input: true


# Directory Configuration
directories:
  image_dir: "/root/code/output/test"
  output_dir: "/root/code/output/test/colmap_output"
  mvs_dir: "/root/code/output/test/mvs"
  sd_features_dir: "/root/code/output/test/mvs/SD"

# Point Cloud Processing
pointcloud:
  # Statistical Outlier Removal (SOR) parameters
  sor:
    nb_neighbors: 5000
    std_ratio: 0.1
    device: "cuda"
    batch_size: 1000
  
  # Visualization settings
  visualization:
    window_name: "Sparse Point Cloud"
    window_width: 1280
    window_height: 720
    zoom_level: 0.8
    camera:
      front: [0, 0, -1]
      lookat: [0, 0, 0]
      up: [0, -1, 0]

# GSPL Pipeline Configuration
gspl:
  args:
    - "fit"
    - "--config"
    - "gsplat_light/configs/spot_less_splats/gsplat-cluster.yaml"
    - "--data.parser.split_mode"
    - "reconstruction"
    - "--data.path"
    - "/root/code/output/test/mvs"
    - "-n"
    - "spotless_watchtower"
    - "--trainer.max_epochs"
    - "6"
    - "--viewer"

# Processing Flags
flags:
  view_pointcloud: true
  save_pointcloud: true
  filter_pointcloud: true
  is_dense: true
