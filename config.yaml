# Video Processing Configuration
video:
  input_path: "/root/code/extra3/datasets/tanks_and_temples/videos/Meetingroom.mp4" # "swapnanil.mp4" "watchtower.mp4"
  fps: 2 # extract every n-th frame in the video or in other words divide video frame rate by this value
  num_frames: 300
  extracted_image_dir: "/root/code/output/colmap/tanks_and_temples/videos/meeting_room_hypermapper/images"
  video_input: true


# OUTPUT Directory Configuration
directories:
  image_dir: "/root/code/output/colmap/tanks_and_temples/videos/meeting_room_hypermapper"
  output_dir: "/root/code/output/colmap/tanks_and_temples/videos/meeting_room_hypermapper"
  mvs_dir: "/root/code/output/colmap/tanks_and_temples/videos/meeting_room_hypermapper/mvs"

# Point Cloud Processing
pointcloud:
  # Statistical Outlier Removal (SOR) parameters
  sor:
    nb_neighbors: 5000
    std_ratio: 0.1
    device: "cuda"
    batch_size: 1000
  
  # Visualization settings
  visualization:
    window_name: "Sparse Point Cloud"
    window_width: 1280
    window_height: 720
    zoom_level: 0.8
    camera:
      front: [0, 0, -1]
      lookat: [0, 0, 0]
      up: [0, -1, 0]

